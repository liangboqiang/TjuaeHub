name: 构建官方资源市场

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - '.github/scripts/**'
      - '.github/workflows/build-assets.yml'
      - 'skills/**'
      - 'assistants/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'bun.lock'
      - 'package.json'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 配置 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 验证源码与构建产物
        run: bun run verify

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 配置 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 重新生成并验证待发布产物
        run: bun run verify

      - name: 将静态索引提交到 main
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          MAIN_SHA=$(git rev-parse --short HEAD)
          git add -f dist/skills.json dist/assistants.json

          if git diff --staged --quiet; then
            echo "分发产物没有变化。"
            exit 0
          fi

          git commit -m "chore(dist): 基于 main@${MAIN_SHA} 构建"
          git push origin HEAD:main
