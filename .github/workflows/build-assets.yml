name: 构建原子资产

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - '.github/scripts/**'
      - '.github/workflows/build-assets.yml'
      - 'assets/**'
      - 'submissions/**'
      - 'policies/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'tests/**'
      - 'bun.lock'
      - 'package.json'
      - 'tsconfig.json'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 配置 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 验证源码与构建产物
        run: bun run verify

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 配置 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 重新生成并验证待发布产物
        run: bun run verify

      - name: 发布 dist 分支
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          MAIN_SHA=$(git rev-parse --short HEAD)
          DIST_TMP=$(mktemp -d)
          cp dist/*.zip dist/index.json dist/seed-manifest.json "${DIST_TMP}/"

          if git ls-remote --exit-code origin dist >/dev/null 2>&1; then
            git fetch origin dist
            git checkout -B dist FETCH_HEAD
          else
            git checkout --orphan dist
          fi

          git rm -rf --ignore-unmatch .
          git clean -ffdx
          cp "${DIST_TMP}/"*.zip "${DIST_TMP}/index.json" "${DIST_TMP}/seed-manifest.json" .
          git add -A

          if git diff --staged --quiet; then
            echo "分发产物没有变化。"
            exit 0
          fi

          git commit -m "chore(dist): 基于 main@${MAIN_SHA} 构建"
          git push origin dist
          git tag "dist-${MAIN_SHA}"
          git push origin "dist-${MAIN_SHA}"
