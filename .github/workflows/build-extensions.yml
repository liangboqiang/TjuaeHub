name: Build Extensions

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/**'
      - '.github/workflows/build-extensions.yml'
      - 'extensions/**'
      - 'pending/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'tests/**'
      - 'bun.lock'
      - 'package.json'
      - 'tsconfig.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify source and build artifacts
        run: bun run verify

      - name: Deploy dist branch
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          MAIN_SHA=$(git rev-parse --short HEAD)
          cp -r dist /tmp/tjuae-hub-dist

          if git ls-remote --exit-code origin dist >/dev/null 2>&1; then
            git fetch origin dist
            git checkout -B dist FETCH_HEAD
          else
            git checkout --orphan dist
          fi

          git rm -rf --ignore-unmatch .
          cp /tmp/tjuae-hub-dist/*.zip /tmp/tjuae-hub-dist/index.json .
          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(dist): build from main@${MAIN_SHA}"
          git push origin dist
          git tag "dist-${MAIN_SHA}"
          git push origin "dist-${MAIN_SHA}"
          git tag -f dist-latest
          git push origin dist-latest --force
